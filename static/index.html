<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ポモドーロタイマー</h1>
        
        <!-- タイマー表示 -->
        <div class="timer-container">
            <svg class="progress-ring" width="300" height="300">
                <circle
                    class="progress-ring-bg"
                    cx="150"
                    cy="150"
                    r="130"
                />
                <circle
                    class="progress-ring-circle"
                    cx="150"
                    cy="150"
                    r="130"
                    id="progress-circle"
                />
            </svg>
            <div class="timer-display" id="timer-display">25:00</div>
        </div>

        <!-- 操作ボタン -->
        <div class="controls">
            <button id="start-btn" class="btn btn-primary">開始</button>
            <button id="pause-btn" class="btn btn-secondary" disabled>一時停止</button>
            <button id="reset-btn" class="btn btn-secondary">リセット</button>
        </div>

        <!-- 進捗表示 -->
        <div class="progress-info">
            <h2>進捗状況</h2>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">完了セッション数:</span>
                    <span class="stat-value" id="sessions-completed">0</span>
                </div>
            </div>
            <div class="history" id="history-list">
                <!-- 履歴がここに動的に追加されます -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
